name: App Store Connect tester invite

# Run by hand (or by the CEO agent) to check a tester's App Store Connect
# invite, resend it once, or add an accepted user to the internal TestFlight
# group. Uses the same ASC API key as the TestFlight build. Touches nothing
# else in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Tester email
        required: true
      first_name:
        required: true
      last_name:
        required: true
      action:
        description: "status | resend | add | invite"
        required: true
        default: status

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography requests
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TESTER_EMAIL: ${{ inputs.email }}
          TESTER_FIRST: ${{ inputs.first_name }}
          TESTER_LAST: ${{ inputs.last_name }}
          TESTER_ACTION: ${{ inputs.action }}
          ASC_APP_ID: '6833269532'
          ASC_GROUP_ID: 'bdbc58e3-f722-4165-a5a6-2d87d7421f7e'
        run: python3 scripts/asc_tester.py
