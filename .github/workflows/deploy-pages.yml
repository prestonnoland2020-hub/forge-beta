name: Deploy Forge beta to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: forge-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_DEMO_MODE: "false"
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
    steps:
      - name: Check out Forge
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Confirm public app configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Check and build Forge
        run: |
          npm run typecheck
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Forge site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # GitHub sometimes lists a just-uploaded artifact late, and deploy-pages
      # then fails with "No artifacts named github-pages" (Nov 16, Nov 24).
      # Wait until the run's artifact list shows it (up to ~2 minutes).
      - name: Wait for the site artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "artifact listed after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "artifact still not listed; trying the deploy anyway"

      - name: Deploy Forge beta
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Give GitHub a moment, then deploy again
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy Forge beta (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
