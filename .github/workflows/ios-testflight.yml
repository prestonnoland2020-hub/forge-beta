name: iOS build to TestFlight

# Builds the Capacitor iOS app on a GitHub Mac and uploads it to TestFlight.
# Run it from the Actions tab ("Run workflow") or with:
#   gh workflow run ios-testflight.yml -R prestonnoland2020-hub/forge-beta
# Signing is automatic: Xcode uses the App Store Connect API key for profiles.
# If the IOS_DIST_CERT_P12 / IOS_DIST_CERT_PASSWORD secrets are set, the stored
# signing certificate(s) are imported into a temporary keychain first, so Xcode
# reuses them instead of creating a new Apple certificate on every fresh runner
# (which hit Apple's certificate limit on Nov 16). Without the secrets the
# build behaves exactly as before.

# Every merge to main ships a new TestFlight build, so the app on testers'
# phones matches the website. A newer merge replaces a build still in progress.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**', 'tests/**']
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_DEMO_MODE: "false"
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      TEAM_ID: 783L8Y46SY
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Each run gets a higher build number than the last; TestFlight refuses repeats.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build the web app
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm ci
          npm run build
          npx cap sync ios

      - name: Install the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Import the stored signing certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$IOS_DIST_CERT_P12" ]; then
            echo "No stored certificate secret; Xcode will manage certificates itself."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/forge-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/forge-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/forge-signing.p12" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/forge-signing.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Without a stored certificate, Xcode makes a new Apple Development
      # certificate on every fresh runner and Apple's limit stops the build.
      # Revoke the unusable ones CI made earlier (named "Created via API") so
      # there is always room. Certificates made on a Mac are never touched.
      - name: Free a development certificate slot
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        run: |
          if [ -n "$IOS_DIST_CERT_P12" ]; then echo "Stored certificate in use; nothing to free."; exit 0; fi
          python3 -m pip install --quiet --break-system-packages 'pyjwt[crypto]' 2>/dev/null || python3 -m pip install --quiet 'pyjwt[crypto]'
          python3 scripts/free-dev-cert-slot.py

      # Signed at archive time so the push-notification entitlement
      # (App/App.entitlements) is embedded; an unsigned archive carries no
      # entitlements and the export could not add them. Development signing
      # needs a registered device; Preston's iPhone is registered on the team.
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Forge.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Forge.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/forge-signing.keychain-db" 2>/dev/null || true
